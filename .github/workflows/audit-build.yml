name: PonyUp Audit Build

on:
  push:
    branches:
      - audit-priority-fixes-20260930
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PonyUpPerformance.sln

      - name: Build
        run: dotnet build PonyUpPerformance.sln -c Release --no-restore
